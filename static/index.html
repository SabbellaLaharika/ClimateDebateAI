<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Climate Debate AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --supportive: #22c55e;
            --opposed: #ef4444;
            --neutral: #eab308;
            --usa-color: #3b82f6;
            --eu-color: #a855f7;
            --china-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        main {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .controls-card {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #loader {
            display: none;
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .debate-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 1.5rem;
            border-left: 4px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .agent-usa { border-left-color: var(--usa-color); }
        .agent-eu { border-left-color: var(--eu-color); }
        .agent-china { border-left-color: var(--china-color); }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .agent-name {
            font-weight: 800;
            font-size: 1.2rem;
        }

        .agent-usa .agent-name { color: var(--usa-color); }
        .agent-eu .agent-name { color: var(--eu-color); }
        .agent-china .agent-name { color: var(--china-color); }

        .stance-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stance-supportive { background-color: rgba(34, 197, 94, 0.2); color: var(--supportive); }
        .stance-opposed { background-color: rgba(239, 68, 68, 0.2); color: var(--opposed); }
        .stance-neutral { background-color: rgba(234, 179, 8, 0.2); color: var(--neutral); }

        .message-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e2e8f0;
        }
        
        .meta-info {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--opposed);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Global Climate Debate AI</h1>
        <p class="subtitle">Multi-Agent Simulation (USA, EU, China)</p>
    </header>

    <main>
        <div class="controls-card">
            <div class="form-group">
                <label for="topic">Debate Topic</label>
                <input type="text" id="topic" placeholder="e.g., Implementing a global carbon tax" required>
            </div>
            <div class="form-group">
                <label for="rounds">Number of Rounds (1-5)</label>
                <input type="number" id="rounds" min="1" max="5" value="2" required>
            </div>
            <button id="start-btn">Start Simulation</button>
            <div id="error-msg" class="error"></div>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p>Simulating debate... This may take a minute.</p>
        </div>

        <div id="debate-container" class="debate-container">
            <!-- Messages will be injected here -->
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
